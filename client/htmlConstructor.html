<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modo Claro / Oscuro</title>
    <style>
        /* Variables por defecto (Modo Claro) */
:root {
  --bg-color: #ffffff;
  --text-color: #1a1a1a;
  --button-bg: #0076ff;
  --button-text: #ffffff;
  transition: background-color 0.3s ease, color 0.3s ease;
}

/* Variables cuando el atributo cambia a modo oscuro */
[data-theme="dark"] {
  --bg-color: #121212;
  --text-color: #f5f5f5;
  --button-bg: #f5f5f5;
  --button-text: #121212;
}

body {
  background-color: var(--bg-color);
  color: var(--text-color);
  font-family: sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  margin: 0;
}

button {
  background-color: var(--button-bg);
  color: var(--button-text);
  border: none;
  padding: 10px 20px;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
}

    </style>
</head>

<body>
    <h1>Implementación de Tema con Vite</h1>
    <button id="theme-toggle">Cambiar modo</button>
    <img src="" alt="">

    <script>

        // Seleccionar elementos del DOM
        const themeToggleBtn = document.getElementById('theme-toggle')
        const rootElement = document.documentElement; // Representa el tag <html>

        // 1. Obtener el tema inicial (localStorage -> Preferencia del Sistema -> Por defecto Claro)
        const getInitialTheme = () =>{
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light' || savedTheme === 'dark') {
                return savedTheme;
            }

            // Si no hay guardado, revisar si el sistema del usuario prefiere modo oscuro
            const userPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            return userPrefersDark ? 'dark' : 'light';
        };

        // 2. Aplicar el tema al documento
        const applyTheme = (theme)=> {
            rootElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            themeToggleBtn.textContent = theme === 'dark' ? '☀️ Modo Claro' : '🌙 Modo Oscuro';
        };

        // Inicializar la aplicación con el tema correspondiente
        let currentTheme = getInitialTheme();
        applyTheme(currentTheme);

        // 3. Manejar el evento de click para cambiar el tema
        themeToggleBtn.addEventListener('click', () => {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            applyTheme(currentTheme);

        });

    </script>
</body>

</html>
